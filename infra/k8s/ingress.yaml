apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amrutam-backend-ingress
  namespace: telemedicine
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  tls:
    - hosts:
        - api.amrutam.co.in
      secretName: amrutam-api-tls
  rules:
    - host: api.amrutam.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amrutam-backend-service
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amrutam-backend-config
  namespace: telemedicine
data:
  NODE_ENV: "production"
  PORT: "4000"
  API_PREFIX: "/api/v1"
  DB_HOST: "amrutam-aurora-pg.cluster-ro-xxx.ap-south-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "amrutam_telemedicine"
  REDIS_HOST: "amrutam-redis.cache.amazonaws.com"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
